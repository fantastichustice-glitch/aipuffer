<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>복어 수영 대회</title>
<style>
:root{--bg:#e9f6ff;--fg:#0f3350;--panel:#fff;--line:#b7d7ec;--w1:#d4f0ff;--w2:#86cbf0;--ac:#e8478a;--mut:#58768c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1a26;--fg:#e3f1fb;--panel:#132b3d;--line:#274a63;--w1:#1a5877;--w2:#0e3a55;--mut:#8fb0c6}}
:root[data-theme="dark"]{--bg:#0b1a26;--fg:#e3f1fb;--panel:#132b3d;--line:#274a63;--w1:#1a5877;--w2:#0e3a55;--mut:#8fb0c6}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
.wrap{max-width:880px;margin:0 auto;padding:14px}
h1{font-size:26px;margin:6px 0 12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.mut{color:var(--mut)}.small{font-size:13px}
input[type=text],textarea{width:100%;box-sizing:border-box;border:1px solid var(--line);border-radius:10px;padding:9px;background:var(--bg);color:var(--fg);font:inherit}
textarea{height:64px;font:12px monospace;word-break:break-all}
button{border:0;border-radius:10px;padding:10px 16px;background:var(--ac);color:#fff;font:700 15px inherit;cursor:pointer}
button.alt{background:#2a7fb8}button:active{transform:scale(.96)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0}
.slot{border-top:1px dashed var(--line);padding:10px 0}.slot label{display:block;font-size:13px;color:var(--mut);margin:6px 0 3px}
.lane{position:relative;height:104px;margin:8px 0;border-radius:14px;overflow:hidden;background:linear-gradient(90deg,var(--w1),var(--w2));border:1px solid var(--line)}
.lane:after{content:"";position:absolute;right:20px;top:0;bottom:0;width:8px;background:repeating-linear-gradient(#111 0 8px,#fff 8px 16px)}
.lane.won{outline:4px solid gold;outline-offset:-4px}
.nm{position:absolute;left:12px;top:6px;font-weight:700;z-index:2}
.fin{position:absolute;right:42px;top:6px;font-size:13px;z-index:2}
.fish{position:absolute;top:30px;width:90px;left:calc((100% - 112px)*var(--p)/100);transition:left .09s linear,transform .08s;animation:bob 1.1s ease-in-out infinite alternate}
@keyframes bob{to{translate:0 -5px}}
@media (prefers-reduced-motion:reduce){.fish{animation:none}}
.win{position:absolute;right:42px;bottom:6px;padding:5px 10px;font-size:13px}
#ov{text-align:center;font-size:30px;font-weight:800;min-height:44px}
#pad{display:flex;gap:10px;margin-top:10px}
#pad button{flex:1;font-size:32px;padding:22px 0;background:#2a7fb8;touch-action:manipulation;user-select:none}
#pad button.next{background:var(--ac)}
</style></head><body><div class="wrap">
<h1>🐡 복어 수영 대회</h1>

<section id="home" class="card">
 <p>A · D 키를 번갈아 빠르게 연타해서 헤엄치세요! 우승자는 방장(심판)이 정합니다.</p>
 <input type="text" id="nm" placeholder="닉네임" maxlength="8">
 <label class="small"><input type="checkbox" id="spec"> 방장은 심판만 하고 헤엄치지 않기</label>
 <div class="row"><button id="bHost">방 만들기 (방장)</button><button id="bJoin" class="alt">참가하기</button></div>
 <p class="mut small">서버 없이 WebRTC P2P로 연결해요. 방장이 만든 초대 코드를 참가자에게 전달하면, 참가자가 응답 코드를 돌려줘서 연결됩니다. (최대 5명)</p>
</section>

<section id="join" class="card" hidden>
 <b>참가하기</b>
 <p class="small mut">① 방장에게 받은 초대 코드를 붙여넣고 ② 만들어진 응답 코드를 방장에게 보내세요.</p>
 <textarea id="offerIn" placeholder="초대 코드 붙여넣기"></textarea>
 <div class="row"><button id="mkAns">응답 코드 만들기</button></div>
 <textarea id="ansOut" readonly placeholder="여기에 응답 코드가 생겨요 (클릭하면 복사)"></textarea>
 <p class="small mut" id="jst"></p>
</section>

<section id="game" hidden>
 <div class="card" id="hostPanel" hidden>
  <b>참가자 연결</b> <span class="small mut">(초대 코드를 보내고, 받은 응답 코드를 붙여넣은 뒤 연결)</span>
  <div id="slots"></div>
  <button id="addSlot" class="alt">+ 참가자 추가</button>
 </div>
 <div class="row"><button id="bStart">🏁 시작</button><button id="bReset" class="alt">처음으로</button><span id="info" class="mut small"></span></div>
 <div id="ov"></div>
 <div id="lanes"></div>
 <div id="pad"><button id="kA">A</button><button id="kD">D</button></div>
</section>
</div>

const $=s=>document.querySelector(s);
const CFG={iceServers:[{urls:'stun:stun.l.google.com:19302'}]};
let me={id:null,name:'',host:false,spec:false};
let S={phase:'lobby',count:0,winner:null,players:{}};
let peers=[],hostDC=null,nextId=1;
let pos=0,vel=0,fin=null,lastKey=null,raceStart=0,tilt=0;

const waitIce=pc=>new Promise(r=>{if(pc.iceGatheringState==='complete')return r();const t=setTimeout(r,3500);pc.addEventListener('icegatheringstatechange',()=>{if(pc.iceGatheringState==='complete'){clearTimeout(t);r()}})});
const code=pc=>btoa(JSON.stringify(pc.localDescription));
const send=(dc,m)=>{if(dc&&dc.readyState==='open')dc.send(JSON.stringify(m))};
const copyEl=el=>{el.select();try{document.execCommand('copy')}catch(e){}};
const showGame=()=>{$('#home').hidden=$('#join').hidden=true;$('#game').hidden=false};

/* ---------- 방장 ---------- */
$('#bHost').onclick=()=>{
  me={id:0,name:$('#nm').value.trim()||'방장',host:true,spec:$('#spec').checked};
  if(!me.spec)S.players[0]={name:me.name,pos:0,fin:null};
  showGame();$('#hostPanel').hidden=false;addSlot();
  setInterval(()=>peers.forEach(p=>send(p.dc,{t:'state',s:S})),80);
};
async function addSlot(){
  if(peers.length>=4)return;
  const p={id:nextId++,pc:new RTCPeerConnection(CFG)};peers.push(p);
  p.dc=p.pc.createDataChannel('g');
  p.dc.onmessage=e=>hRecv(p,JSON.parse(e.data));
  p.dc.onopen=()=>p.st.textContent='✅ 연결됨';
  p.dc.onclose=()=>drop(p);
  const el=p.el=document.createElement('div');el.className='slot';
  el.innerHTML=`<b>참가자</b> <span class="st small">대기중</span><label>① 초대 코드 (클릭하면 복사)</label><textarea class="off" readonly>생성 중…</textarea><label>② 참가자의 응답 코드 붙여넣기</label><textarea class="ans"></textarea><div class="row"><button class="con alt">연결</button></div>`;
  $('#slots').append(el);p.st=el.querySelector('.st');
  el.querySelector('.off').onclick=e=>copyEl(e.target);
  el.querySelector('.con').onclick=async()=>{try{await p.pc.setRemoteDescription(JSON.parse(atob(el.querySelector('.ans').value.trim())));p.st.textContent='연결 중…'}catch(e){alert('응답 코드를 확인하세요')}};
  $('#addSlot').hidden=peers.length>=4;
  await p.pc.setLocalDescription(await p.pc.createOffer());await waitIce(p.pc);
  el.querySelector('.off').value=code(p.pc);
}
$('#addSlot').onclick=addSlot;
function drop(p){delete S.players[p.id];peers=peers.filter(x=>x!==p);p.el.remove();$('#addSlot').hidden=false}
function hRecv(p,m){
  if(m.t==='hello'){S.players[p.id]={name:m.name,pos:0,fin:null};send(p.dc,{t:'welcome',id:p.id})}
  else if(m.t==='pos'&&S.players[p.id]&&S.phase==='race'){S.players[p.id].pos=m.pos;S.players[p.id].fin=m.fin}
}
function resetPlayers(){Object.values(S.players).forEach(p=>{p.pos=0;p.fin=null});pos=vel=0;fin=null;lastKey=null;S.winner=null}
$('#bStart').onclick=()=>{
  resetPlayers();S.phase='count';S.count=3;
  const iv=setInterval(()=>{if(--S.count<=0){clearInterval(iv);S.phase='race';raceStart=performance.now()}},1000);
};
$('#bReset').onclick=()=>{resetPlayers();S.phase='lobby'};
function pick(id){S.winner=id;S.phase='done'}

/* ---------- 참가자 ---------- */
$('#bJoin').onclick=()=>{$('#home').hidden=true;$('#join').hidden=false};
$('#ansOut').onclick=e=>copyEl(e.target);
$('#mkAns').onclick=async()=>{
  try{
    me.name=$('#nm').value.trim()||'참가자';
    const pc=new RTCPeerConnection(CFG);
    pc.ondatachannel=e=>{hostDC=e.channel;
      hostDC.onopen=()=>{send(hostDC,{t:'hello',name:me.name});showGame();$('#bStart').hidden=$('#bReset').hidden=true};
      hostDC.onmessage=e=>gRecv(JSON.parse(e.data));
      hostDC.onclose=()=>{alert('방장과 연결이 끊겼어요');location.reload()}};
    await pc.setRemoteDescription(JSON.parse(atob($('#offerIn').value.trim())));
    await pc.setLocalDescription(await pc.createAnswer());await waitIce(pc);
    $('#ansOut').value=code(pc);$('#jst').textContent='응답 코드를 방장에게 보내고, 방장이 연결할 때까지 기다리세요.';
  }catch(e){alert('초대 코드를 확인하세요')}
};
function gRecv(m){
  if(m.t==='welcome')me.id=m.id;
  else if(m.t==='state'){
    const prev=S.phase;S=m.s;
    if(S.phase==='count'&&prev!=='count'){pos=vel=0;fin=null;lastKey=null}
    if(S.phase==='race'&&prev!=='race')raceStart=performance.now();
    if(S.phase==='lobby'){pos=vel=0;fin=null}
  }
}
setInterval(()=>{if(hostDC&&S.phase==='race')send(hostDC,{t:'pos',pos,fin})},80);

/* ---------- 조작 ---------- */
function tap(k){
  if(S.phase!=='race'||me.spec||fin!=null||me.id==null||k===lastKey)return;
  lastKey=k;vel=Math.min(12,vel+1.4);tilt=tilt>=0?-9:9;
}
addEventListener('keydown',e=>{
  if(e.repeat||e.target.matches('input,textarea'))return;
  if(e.code==='KeyA'||e.code==='ArrowLeft')tap('A');
  else if(e.code==='KeyD'||e.code==='ArrowRight')tap('D');
});
['A','D'].forEach(k=>$('#k'+k).addEventListener('pointerdown',e=>{e.preventDefault();tap(k)}));

/* ---------- 렌더 ---------- */
const lanes=$('#lanes'),els={};
function render(){
  for(const id in els)if(!S.players[id]){els[id].root.remove();delete els[id]}
  const order=Object.entries(S.players).filter(([,p])=>p.fin!=null).sort((a,b)=>a[1].fin-b[1].fin).map(e=>e[0]);
  for(const id in S.players){
    const p=S.players[id];let e=els[id];
    if(!e){const root=document.createElement('div');root.className='lane';
      root.innerHTML=`<div class="nm"></div><div class="fin"></div><img class="fish" src="${FISH}" alt=""><button class="win">🏆 우승 선언</button>`;
      e=els[id]={root,nm:root.children[0],fin:root.children[1],fish:root.children[2],win:root.children[3]};
      e.win.onclick=()=>pick(id);lanes.append(root)}
    const mine=+id===me.id,ps=mine?pos:p.pos,f=mine?fin:p.fin;
    e.nm.textContent=(mine?'⭐ ':'')+p.name;
    e.fin.textContent=f!=null?`🏁 ${order.indexOf(id)+1}번째 · ${f}초`:Math.round(ps)+'%';
    e.fish.style.setProperty('--p',ps);
    e.fish.style.transform=mine?`rotate(${tilt}deg)`:'';
    e.root.classList.toggle('won',S.winner==id);
    e.win.hidden=!(me.host&&(S.phase==='race'||S.phase==='done'));
  }
  const w=S.players[S.winner];
  $('#ov').textContent=S.phase==='count'?S.count:S.phase==='done'&&w?`🏆 ${w.name} 우승!`:S.phase==='race'?'A · D 연타!':'';
  $('#bStart').hidden=!(me.host&&S.phase==='lobby');
  $('#bReset').hidden=!(me.host&&(S.phase==='race'||S.phase==='done'));
  $('#info').textContent=S.phase==='lobby'?(me.host?'참가자를 연결하고 시작을 누르세요':'방장이 시작하길 기다리는 중'):S.phase==='race'&&me.host?'골인한 복어 중에서 우승자를 골라주세요':'';
  $('#kA').classList.toggle('next',lastKey==='D');$('#kD').classList.toggle('next',lastKey==='A');
  $('#pad').hidden=me.spec;
}
let lt=performance.now();
(function loop(t){
  const dt=Math.min(.05,(t-lt)/1000);lt=t;
  if(S.phase==='race'&&!me.spec&&fin==null&&me.id!=null){
    vel*=Math.exp(-1.5*dt);pos+=vel*dt;
    if(pos>=100){pos=100;vel=0;fin=+((t-raceStart)/1000).toFixed(2)}
  }
  if(me.host&&!me.spec&&S.players[0]){S.players[0].pos=pos;S.players[0].fin=fin}
  if(!$('#game').hidden)render();
  requestAnimationFrame(loop);
})(lt);
</script></body></html>
